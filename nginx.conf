server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    application/xml image/svg+xml font/woff font/woff2;

  # Vite emits content-hashed filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: React Router owns the routes, so every unknown path
  # must return index.html instead of nginx's 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html itself must never be cached, or deploys go unnoticed.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
