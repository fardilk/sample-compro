server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    application/xml image/svg+xml font/woff font/woff2;

  # Astro emits content-hashed filenames under /_astro/, so they can be cached
  # forever. ^~ keeps the regex block below from taking the fonts in here.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything in public/: stable names, so cache for a month, not a year.
  location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Pages are prerendered, so /about-us resolves to about-us.html. Anything
  # genuinely missing gets the real 404 page with a 404 status, not the
  # homepage with a 200. HTML is never cached, or deploys go unnoticed.
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
