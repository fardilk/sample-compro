name: Build and Deploy (Dev)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/fardilk/excellenceplusweb

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert required secrets exist
        shell: bash
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY_B64: ${{ secrets.VPS_KEY_B64 }}
          VPS_DEV_PORT: ${{ secrets.VPS_DEV_PORT }}
        run: |
          set -e
          for n in GHCR_PAT VPS_HOST VPS_USER VPS_KEY_B64 VPS_DEV_PORT; do
            [ -n "${!n}" ] && echo "$n present" || { echo "Missing secret: $n"; exit 1; }
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u fardilk --password-stdin

      - name: Build and Push Docker image (dev)
        run: |
          set -e
          TAG_SHA=${GITHUB_SHA::7}
          docker build -t $IMAGE_NAME:dev-$TAG_SHA -t $IMAGE_NAME:dev-latest .
          docker push $IMAGE_NAME:dev-$TAG_SHA
          docker push $IMAGE_NAME:dev-latest

      - name: Prepare SSH key
        shell: bash
        env:
          VPS_KEY_B64: ${{ secrets.VPS_KEY_B64 }}
        run: |
          set -e
          echo "$VPS_KEY_B64" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy to VPS (Dev)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_DEV_PORT }}
          key_path: key.pem
          script_stop: true
          script: |
            set -e
            IMAGE=ghcr.io/fardilk/excellenceplusweb:dev-latest
            NAME=excellenceplusweb-dev
            PORT=8080

            docker login ghcr.io -u fardilk -p ${{ secrets.GHCR_PAT }}

            # Pull before touching the running container. A failed pull used to
            # fall through and restart the container from whatever stale image
            # was still cached, silently redeploying an old build.
            pulled=0
            for i in 1 2 3; do
              if docker pull "$IMAGE"; then pulled=1; break; fi
              echo "pull attempt $i failed, retrying in 5s"
              sleep 5
            done
            if [ "$pulled" != 1 ]; then
              echo "ERROR: could not pull $IMAGE. Leaving the running container untouched."
              exit 1
            fi

            docker rm -f "$NAME" || true
            docker run -d --name "$NAME" -p "$PORT:80" --restart always "$IMAGE"

            # Smoke check: / alone is not enough, a broken image still serves it.
            for p in / /about-us /services/training/leadership; do
              code=""
              for i in 1 2 3 4 5; do
                code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT$p" || true)
                # `[ ... ] && break` would return non-zero on a miss and set -e
                # would kill the script before the retry ever happened.
                if [ "$code" = "200" ]; then
                  break
                fi
                sleep 2
              done
              if [ "$code" != "200" ]; then
                echo "ERROR: smoke check failed for $p (got $code)"
                exit 1
              fi
              echo "ok $p"
            done

            docker image prune -f
